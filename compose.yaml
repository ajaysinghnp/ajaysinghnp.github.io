services:
  app:
    image: ajaysinghnp/ajaysinghnp.github.io:latest
    container_name: ajaysingh.com.np
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: true

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
